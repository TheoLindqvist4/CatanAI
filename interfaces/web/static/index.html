<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CatanIA</title>
  <link rel="stylesheet" href="/app/app.css">
</head>
<body>
  <header>
    <h1>CatanIA</h1>
    <div class="controls">
      <label>Opponent
        <!-- Filled from /api/geometry: which opponents exist depends on whether a trained
             champion loads, so listing them here would offer one the server would refuse. -->
        <select id="opponent"></select>
      </label>
      <label>Your seat
        <!-- Empty means you play. Anything else puts an agent in your seat and the game
             becomes one to watch: the server paces it and the board draws every decision.
             Also filled from /api/geometry, for the same reason as the opponent list. -->
        <select id="watch"></select>
      </label>
      <label>Rules
        <select id="rules">
          <option value="ranked1v1">Ranked 1v1 (15 pts)</option>
          <option value="base">Base game (10 pts)</option>
        </select>
      </label>
      <label>Seed <input id="seed" type="number" placeholder="random"></label>
      <button id="new-game">New game</button>
      <!-- Available at any point, not only at the end: what the dice have been doing is
           worth knowing while there is still something to do about it. Fetched on click
           from its own endpoint, so the payload behind every move stays the size it was. -->
      <button id="stats">Stats</button>
    </div>
  </header>

  <main>
    <section class="board-pane">
      <div id="hint" class="hint">Starting…</div>
      <div id="board-wrap"><svg id="board" xmlns="http://www.w3.org/2000/svg"></svg></div>
    </section>

    <aside class="side">
      <div class="dice-row">
        <div class="dice" id="dice">–</div>
        <div class="dice-label">
          <div id="turn-label">turn 0</div>
          <div id="phase-label" class="muted"></div>
        </div>
      </div>

      <div id="players"></div>

      <div class="panel">
        <h2>Build</h2>
        <div id="modes" class="buttons"></div>
        <h2>Actions</h2>
        <div id="panel" class="buttons"></div>
      </div>

      <div class="panel">
        <h2>Supply</h2>
        <div id="supply" class="muted"></div>
      </div>

      <div class="panel log-panel">
        <h2>Log</h2>
        <ol id="log"></ol>
      </div>
    </aside>
  </main>

  <!-- Both filled in by app.js and hidden until they have something to say. The board is
       what they are about, so they are drawn over it rather than beside it — and a game
       that has ended has nothing left to click underneath. -->
  <div id="result" class="overlay" hidden></div>
  <div id="stats-modal" class="overlay" hidden></div>

  <script src="/app/app.js"></script>
</body>
</html>
